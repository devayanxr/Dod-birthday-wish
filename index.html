<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>

  /* ============================================================
     EDIT YOUR MESSAGE, NAMES, AND PHOTOS AT THE TOP OF THE
     <script> TAG NEAR THE BOTTOM OF THIS FILE — LOOK FOR "CONFIG"
     ============================================================ */

  :root{
    --color-bg: #1b1b2f;
    --color-bg-soft: #232338;
    --color-paper: #f7f2ea;
    --color-accent: #e8b04b;
    --color-blush: #e8a2a2;
    --color-text: #f7f3ed;
    --color-text-muted: #b8b3c7;
    --color-ink: #2c2536;
    --serif: "Fraunces", Georgia, serif;
    --sans: "Work Sans", sans-serif;
  }

  *{ box-sizing: border-box; }

  html{ scroll-behavior: smooth; }

  body{
    margin: 0;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--sans);
    font-weight: 300;
    overflow-x: hidden;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  /* ---------- Envelope cover ---------- */

  #cover{
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 30%, #2a2a45, #15151f 75%);
    z-index: 50;
    transition: opacity 0.9s ease, visibility 0.9s ease;
  }

  #cover.hidden{
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .envelope-wrap{
    text-align: center;
  }

  .envelope{
    width: 240px;
    height: 160px;
    background: var(--color-paper);
    position: relative;
    margin: 0 auto 28px;
    border-radius: 3px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.45);
    cursor: pointer;
    transition: transform 0.3s ease;
  }

  .envelope:hover{ transform: translateY(-4px); }

  .envelope::before,
  .envelope::after{
    content: "";
    position: absolute;
    top: 0;
    width: 0;
    height: 0;
    border-top: 80px solid #e3dbcb;
  }

  .envelope::before{
    left: 0;
    border-left: 120px solid transparent;
  }

  .envelope::after{
    right: 0;
    border-right: 120px solid transparent;
  }

  .flap{
    position: absolute;
    top: 0; left: 0;
    width: 0; height: 0;
    border-left: 120px solid transparent;
    border-right: 120px solid transparent;
    border-top: 90px solid #ddd2ba;
    transform-origin: top center;
    transition: transform 0.7s cubic-bezier(.6,-0.28,.5,1.5);
    z-index: 3;
  }

  .envelope.open .flap{
    transform: rotateX(180deg);
  }

  .seal{
    position: absolute;
    top: 58px;
    left: 50%;
    transform: translateX(-50%);
    width: 46px;
    height: 46px;
    background: var(--color-blush);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--serif);
    font-style: italic;
    font-size: 15px;
    color: #5c2f2f;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.25), 0 3px 8px rgba(0,0,0,0.3);
    z-index: 4;
    transition: opacity 0.3s ease;
  }

  .envelope.open .seal{ opacity: 0; }

  .cover-label{
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.15rem;
    color: var(--color-text-muted);
    letter-spacing: 0.02em;
  }

  .cover-hint{
    margin-top: 10px;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--color-accent);
    opacity: 0.85;
  }

  /* ---------- Main content ---------- */

  main{
    opacity: 0;
    transition: opacity 1s ease 0.3s;
  }

  main.visible{ opacity: 1; }

  section{
    max-width: 720px;
    margin: 0 auto;
    padding: 120px 32px;
  }

  .hero{
    text-align: center;
    padding-top: 140px;
    padding-bottom: 80px;
  }

  .eyebrow{
    font-size: 0.75rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--color-accent);
    margin-bottom: 20px;
  }

  .hero h1{
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(2.4rem, 7vw, 4.2rem);
    line-height: 1.08;
    margin: 0 0 18px;
  }

  .hero h1 em{
    font-style: italic;
    color: var(--color-blush);
    font-weight: 400;
  }

  .hero p{
    color: var(--color-text-muted);
    font-size: 1.05rem;
    max-width: 460px;
    margin: 0 auto;
    line-height: 1.7;
  }

  /* ---------- Letter ---------- */

  .letter{
    background: var(--color-paper);
    color: var(--color-ink);
    border-radius: 4px;
    padding: 64px 56px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.35);
    position: relative;
  }

  .letter::before{
    content: "";
    position: absolute;
    top: 0; left: 40px; right: 40px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0,0,0,0.08), transparent);
  }

  .letter-heading{
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.4rem;
    margin: 0 0 28px;
    color: #6b4a4a;
  }

  .letter p{
    font-family: var(--serif);
    font-size: 1.08rem;
    line-height: 1.85;
    margin: 0 0 22px;
    color: var(--color-ink);
  }

  .letter p:last-of-type{ margin-bottom: 0; }

  .signature{
    margin-top: 36px;
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.2rem;
    color: #6b4a4a;
    text-align: right;
  }

  /* ---------- Gallery ---------- */

  .gallery-heading{
    text-align: center;
    margin-bottom: 56px;
  }

  .gallery-heading .eyebrow{ margin-bottom: 12px; }

  .gallery-heading h2{
    font-family: var(--serif);
    font-weight: 500;
    font-style: italic;
    font-size: 1.8rem;
    margin: 0;
  }

  .gallery{
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 28px 20px;
  }

  .polaroid{
    background: var(--color-paper);
    padding: 14px 14px 40px;
    width: 210px;
    border-radius: 2px;
    box-shadow: 0 14px 30px rgba(0,0,0,0.35);
    transform: rotate(var(--tilt, -3deg));
    transition: transform 0.35s ease;
    position: relative;
  }

  .polaroid:nth-child(2n){ --tilt: 2.5deg; }
  .polaroid:nth-child(3n){ --tilt: -1.5deg; }
  .polaroid:nth-child(4n){ --tilt: 3deg; }

  .polaroid:hover{ transform: rotate(0deg) scale(1.03); z-index: 5; }

  .polaroid .frame{
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #e6e1d6;
    overflow: hidden;
    position: relative;
  }

  .polaroid img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .photo-placeholder{
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 6px;
    color: #9c9488;
    font-family: var(--sans);
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-align: center;
    padding: 10px;
  }

  .photo-placeholder .plus{
    font-family: var(--serif);
    font-size: 1.8rem;
    font-weight: 400;
    color: #c9c1b2;
  }

  .polaroid .caption{
    position: absolute;
    bottom: 12px;
    left: 0; right: 0;
    text-align: center;
    font-family: var(--serif);
    font-style: italic;
    font-size: 0.9rem;
    color: #6b6355;
  }

  /* ---------- Closing ---------- */

  .closing{
    text-align: center;
    padding-top: 40px;
    padding-bottom: 160px;
  }

  .closing p{
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.3rem;
    color: var(--color-text-muted);
    line-height: 1.7;
  }

  .heart-divider{
    color: var(--color-blush);
    font-size: 1.4rem;
    margin: 0 auto 28px;
  }

  @media (max-width: 600px){
    section{ padding: 80px 22px; }
    .letter{ padding: 40px 26px; }
    .polaroid{ width: 42vw; }
  }

</style>
</head>
<body>

  <div id="cover">
    <div class="envelope-wrap">
      <div class="envelope" id="envelope">
        <div class="seal">✦</div>
        <div class="flap"></div>
      </div>
      <div class="cover-label" id="coverLabel">For someone special</div>
      <div class="cover-hint">Tap the envelope to open</div>
    </div>
  </div>

  <main id="main">
    <section class="hero">
      <div class="eyebrow" id="heroEyebrow">A little something</div>
      <h1 id="heroHeading">Happy Birthday, <em>Name</em></h1>
      <p id="heroSubtext">Written from far away, but meant to reach you exactly today.</p>
    </section>

    <section>
      <div class="letter">
        <p class="letter-heading" id="letterHeading">Dear Name,</p>
        <div id="letterBody"></div>
        <p class="signature" id="letterSignature">— Your Name</p>
      </div>
    </section>

    <section>
      <div class="gallery-heading">
        <div class="eyebrow">In frames</div>
        <h2>Little moments we've kept</h2>
      </div>
      <div class="gallery" id="gallery"></div>
    </section>

    <section class="closing">
      <div class="heart-divider">♥</div>
      <p id="closingLine">Wherever you are, I hope today feels like being celebrated in every direction.</p>
    </section>
  </main>

<script>

  /* ==========================================================
     CONFIG — edit everything below this line. No HTML needed.
     ========================================================== */

  const CONFIG = {
    herName: "Dolly",                 // shown in envelope label and headline
    yourName: "Devayan",           // shown as the letter's signature

    heroEyebrow: "A little something",
    heroSubtext: "Written from far away, but meant to reach you exactly today.",

    // Each item in this array becomes one paragraph in the letter.
    // Write it like you're actually talking to her — this is the part
    // people will read slowly. Replace these lines with your own words.
    letterParagraphs: [
      "I keep running out of ways to say this, so I'll just say it plainly: today is about you, and I'm so glad you exist.",
      "There's a version of this birthday where we're in the same room and I get to see your face when you read this. Until then, this is me, reaching across the distance the best way I know how.",
      "I hope this year brings you the things you've been quietly hoping for, and a few you haven't even let yourself ask for yet.",
      "Happy birthday. I Choose you and promise to stick by your side, today and every ordinary day after this one too.",
      "I hope you will let me around you and i promise I will become the one you will be proud of, and not promising only, i will little by liitle implement whatever you have taught me. I am really glad you exist. Tthank you <3"
    ],

    // Photo slots. Drop your image files into the "photos" folder
    // next to this HTML file, and put the matching filename here.
    // If a photo is missing, this slot will just show an empty
    // frame with "Add photo" until you add one — nothing breaks.
    photos: [
      { src: "photos/1.jpg", caption: "the first one" },
      { src: "photos/2.jpg", caption: "that trip" },
      { src: "photos/3.jpg", caption: "just us" },
      { src: "photos/4.jpg", caption: "my favourite" }
    ],

    closingLine: "Wherever you are, I hope today feels like being celebrated in every direction."
  };

  /* ==========================================================
     Rendering — you shouldn't need to touch anything below.
     ========================================================== */

  document.getElementById("coverLabel").textContent = "For " + CONFIG.herName;
  document.getElementById("heroEyebrow").textContent = CONFIG.heroEyebrow;
  document.getElementById("heroHeading").innerHTML = "Happy Birthday, <em>" + CONFIG.herName + "</em>";
  document.getElementById("heroSubtext").textContent = CONFIG.heroSubtext;
  document.getElementById("letterHeading").textContent = "Dear " + CONFIG.herName + ",";
  document.getElementById("letterSignature").textContent = "— " + CONFIG.yourName;
  document.getElementById("closingLine").textContent = CONFIG.closingLine;

  const letterBody = document.getElementById("letterBody");
  CONFIG.letterParagraphs.forEach(text => {
    const p = document.createElement("p");
    p.textContent = text;
    letterBody.appendChild(p);
  });

  const gallery = document.getElementById("gallery");
  CONFIG.photos.forEach((photo, i) => {
    const card = document.createElement("div");
    card.className = "polaroid";

    const frame = document.createElement("div");
    frame.className = "frame";

    const img = document.createElement("img");
    img.src = photo.src;
    img.alt = photo.caption || ("photo " + (i + 1));

    const placeholder = document.createElement("div");
    placeholder.className = "photo-placeholder";
    placeholder.innerHTML = '<span class="plus">+</span><span>Add photo ' + (i + 1) + '</span>';

    img.onerror = () => {
      img.style.display = "none";
      placeholder.style.display = "flex";
    };

    frame.appendChild(img);
    frame.appendChild(placeholder);

    const caption = document.createElement("p");
    caption.className = "caption";
    caption.textContent = photo.caption || "";

    card.appendChild(frame);
    card.appendChild(caption);
    gallery.appendChild(card);
  });

  // Envelope open interaction
  const envelope = document.getElementById("envelope");
  const cover = document.getElementById("cover");
  const main = document.getElementById("main");

  envelope.addEventListener("click", () => {
    envelope.classList.add("open");
    setTimeout(() => {
      cover.classList.add("hidden");
      main.classList.add("visible");
      main.scrollIntoView({ behavior: "smooth", block: "start" });
    }, 750);
  });

</script>
</body>
</html>
